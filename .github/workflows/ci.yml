name: DOR CI

on:
  push:
    branches: [main, fix/p4-governed-patch-record]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Prepare Bubblewrap user namespaces
        run: |
          set -euo pipefail
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            current="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
            echo "kernel.apparmor_restrict_unprivileged_userns=${current}"
            if [ "${current}" = "1" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi

      - name: Verify Bubblewrap runtime
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version
          else
            echo "Bubblewrap is not preinstalled on this runner; installing it via apt."
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y --no-install-recommends bubblewrap
            bwrap --version
          fi
          bwrap --unshare-net --ro-bind / / /bin/true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Alembic has exactly one canonical head
        run: |
          set -euo pipefail
          heads="$(alembic heads)"
          expected="$(python -c 'import json; print(json.load(open("docs/CURRENT_STATE.json"))["canonical_alembic_head"])')"
          printf '%s\n' "$heads"
          test "$heads" = "$expected (head)"
          test "$(printf '%s\n' "$heads" | grep -Ec '\(head\)$')" -eq 1

      - name: Verify clean database migration
        env:
          DATABASE_URL: sqlite:///./dor_runtime.db
        run: |
          set -euo pipefail
          rm -f dor_runtime.db
          alembic upgrade head
          test -f dor_runtime.db

      - name: Run complete test suite with coverage
        env:
          DATABASE_URL: sqlite:///./dor_runtime.db
          DOR_JWT_SECRET_KEY: ci-only-test-secret-change-me
          DOR_ADMIN_PASSWORD: ci-admin-password
          DOR_ADMIN_USERNAME: admin
          DOR_ENV: test
          DOR_ENCRYPTION_KEY: 32-byte-fernet-key-string-placeholder==
          PYTHONPATH: .
          TMPDIR: /tmp
        run: >-
          pytest -q
          --cov
          --cov-config=.coveragerc
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: API startup and health smoke test
        env:
          DATABASE_URL: sqlite:///./dor_runtime.db
          DOR_JWT_SECRET_KEY: ci-only-test-secret-change-me
          DOR_ADMIN_PASSWORD: ci-admin-password
          DOR_ADMIN_USERNAME: admin
          DOR_ENV: test
          DOR_ENCRYPTION_KEY: 32-byte-fernet-key-string-placeholder==
          PYTHONPATH: .
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          uvicorn api.main:app --host 127.0.0.1 --port 8000 >/tmp/dor-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dor-uvicorn.log
          exit 1

  postgres-migrations:
    name: PostgreSQL migration graph
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dor
          POSTGRES_PASSWORD: dor-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dor -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Create migration test databases
        env:
          ADMIN_DATABASE_URL: postgresql://dor:dor-ci-password@127.0.0.1:5432/postgres
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["ADMIN_DATABASE_URL"], autocommit=True) as connection:
              for database in ("dor_005_first", "dor_002b_first", "dor_fresh"):
                  connection.execute(f'CREATE DATABASE "{database}"')
          PY

      - name: Verify upgrade after the 005 branch
        env:
          DATABASE_URL: postgresql+psycopg://dor:dor-ci-password@127.0.0.1:5432/dor_005_first
        run: |
          set -euo pipefail
          alembic upgrade 005_authority_org_scope
          alembic upgrade head
          test "$(alembic current)" = "026_onboarding_intents (head)"

      - name: Verify upgrade after the 002b branch
        env:
          DATABASE_URL: postgresql+psycopg://dor:dor-ci-password@127.0.0.1:5432/dor_002b_first
        run: |
          set -euo pipefail
          alembic upgrade 002b_authority_org_scope
          alembic upgrade head
          test "$(alembic current)" = "026_onboarding_intents (head)"

      - name: Verify clean PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://dor:dor-ci-password@127.0.0.1:5432/dor_fresh
        run: |
          set -euo pipefail
          alembic upgrade head
          test "$(alembic current)" = "026_onboarding_intents (head)"
          alembic downgrade base
          test -z "$(alembic current)"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test repository-native CI watcher
        run: node --test .github/scripts/ci_watch.test.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install bandit pip-audit

      - name: Bandit
        run: >-
          bandit -r
          ai api dashboard domain execution generation infrastructure monitoring
          phase4 phase6 runtime services
          -x tests --severity-level medium

      - name: Dependency audit
        run: pip-audit --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-1325
