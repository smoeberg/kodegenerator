name: PR CI Watch

on:
  workflow_run:
    workflows:
      - DOR CI
      - CodeQL Advanced
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-ci-watch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish terminal CI summary
        uses: actions/github-script@v9
        with:
          script: |
            const watcher = require('./.github/scripts/ci_watch.js');
            await watcher.run({ github, context, core });
