name: Merge Gate & Diff Integrity

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feature/* ]

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic fastapi sqlalchemy uvicorn python-jose alembic

      - name: Run Merge Gate & Diff Integrity Linter
        run: |
          python scripts/ci_merge_gate.py --base origin/main --head HEAD

      - name: Run Test Suite
        run: |
          PYTHONPATH=. python -m pytest tests/
