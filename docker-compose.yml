services:
  # 1. DOR Core REST API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/smoeberg/kodegenerator:latest
    container_name: dor-api
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DOR_DB_PATH=/app/data/dor_runtime.db
      - DOR_ENVIRONMENT=production
      - REDMINE_URL=${REDMINE_URL:-}
      - REDMINE_API_KEY=${REDMINE_API_KEY:-}
      - REDMINE_PROJECT_ID=${REDMINE_PROJECT_ID:-dor}
      - REDMINE_TRACKER_ID=${REDMINE_TRACKER_ID:-1}
      - REDMINE_SEVERITY=${REDMINE_SEVERITY:-ERROR}
    volumes:
      - dor-data:/app/data
      - dor-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 2. DOR Streamlit Dashboard & Web GUI
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/smoeberg/kodegenerator:latest
    container_name: dor-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - DOR_DB_PATH=/app/data/dor_runtime.db
      - DOR_API_URL=http://api:8000
      - DOR_ADMIN_PASSWORD=${DOR_ADMIN_PASSWORD:-admin}
      - REDMINE_URL=${REDMINE_URL:-}
      - REDMINE_API_KEY=${REDMINE_API_KEY:-}
      - REDMINE_PROJECT_ID=${REDMINE_PROJECT_ID:-dor}
      - REDMINE_TRACKER_ID=${REDMINE_TRACKER_ID:-1}
      - REDMINE_SEVERITY=${REDMINE_SEVERITY:-ERROR}
    volumes:
      - dor-data:/app/data
    depends_on:
      api:
        condition: service_started

  # 3. DOR Background Swarm Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/smoeberg/kodegenerator:latest
    container_name: dor-worker
    restart: unless-stopped
    command: ["python3", "-m", "cli.worker"]
    environment:
      - DOR_DB_PATH=/app/data/dor_runtime.db
      - DOR_API_URL=http://api:8000
      - REDMINE_URL=${REDMINE_URL:-}
      - REDMINE_API_KEY=${REDMINE_API_KEY:-}
      - REDMINE_PROJECT_ID=${REDMINE_PROJECT_ID:-dor}
      - REDMINE_TRACKER_ID=${REDMINE_TRACKER_ID:-1}
      - REDMINE_SEVERITY=${REDMINE_SEVERITY:-ERROR}
    volumes:
      - dor-data:/app/data
      - dor-logs:/app/logs
    depends_on:
      api:
        condition: service_started

  # 4. Watchtower: Automatisk opdatering af containere når main/GHCR opdateres
  watchtower:
    image: containrrr/watchtower:latest
    container_name: dor-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval 60 dor-api dor-dashboard dor-worker

volumes:
  dor-data:
    driver: local
  dor-logs:
    driver: local
