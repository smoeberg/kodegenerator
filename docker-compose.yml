# Legacy SQLite development topology. It is not a certified demo installation.
# Use compose.demo.yml for demo work.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: sqlite:////data/kodegenerator.db
      REDIS_URL: redis://redis:6379/0
      DOR_JWT_SECRET_KEY: ${DOR_JWT_SECRET_KEY:-}
      DOR_JWT_SIGNING_KEYS: ${DOR_JWT_SIGNING_KEYS:-}
      DOR_JWT_ACTIVE_KEY_ID: ${DOR_JWT_ACTIVE_KEY_ID:-}
      DOR_JWT_REVOKED_KEY_IDS: ${DOR_JWT_REVOKED_KEY_IDS:-}
      DOR_ADMIN_PASSWORD: ${DOR_ADMIN_PASSWORD:?DOR_ADMIN_PASSWORD must be set}
      DOR_ADMIN_USERNAME: ${DOR_ADMIN_USERNAME:-admin}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/data
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  worker-pool:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: sqlite:////data/kodegenerator.db
      REDIS_URL: redis://redis:6379/0
      DOR_JWT_SECRET_KEY: ${DOR_JWT_SECRET_KEY:-}
      DOR_JWT_SIGNING_KEYS: ${DOR_JWT_SIGNING_KEYS:-}
      DOR_JWT_ACTIVE_KEY_ID: ${DOR_JWT_ACTIVE_KEY_ID:-}
      DOR_JWT_REVOKED_KEY_IDS: ${DOR_JWT_REVOKED_KEY_IDS:-}
      DOR_WORKER_CAPABILITIES: ${DOR_WORKER_CAPABILITIES:?DOR_WORKER_CAPABILITIES must be set}
    volumes:
      - sqlite-data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  otel-collector:
    image: otel/opentelemetry-collector:0.132.0
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config", "/etc/otel-collector-config.yml"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  tui:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: sqlite:////data/kodegenerator.db
      REDIS_URL: redis://redis:6379/0
      DOR_JWT_SECRET_KEY: ${DOR_JWT_SECRET_KEY:-}
      DOR_JWT_SIGNING_KEYS: ${DOR_JWT_SIGNING_KEYS:-}
      DOR_JWT_ACTIVE_KEY_ID: ${DOR_JWT_ACTIVE_KEY_ID:-}
      DOR_JWT_REVOKED_KEY_IDS: ${DOR_JWT_REVOKED_KEY_IDS:-}
    command: ["python", "-m", "services.tui"]
    volumes:
      - sqlite-data:/data
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  sqlite-data:
  redis-data:
