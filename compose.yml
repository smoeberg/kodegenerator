name: dor

x-runtime-environment: &runtime-environment
  DOR_ENV: production
  # Non-secret PostgreSQL connection components. The password is file-backed and
  # the runtime constructs the canonical SQLAlchemy URLs after process start.
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  DOR_PIPELINE_STATE_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
  DOR_QUEUE_BACKEND: database
  ARTIFACT_STORE_URL: http://minio:9000
  ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-dor-artifacts}
  AWS_ACCESS_KEY_ID_FILE: /run/secrets/minio_root_user
  AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_root_password
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
  DOR_JWT_SIGNING_KEYS_FILE: /run/secrets/dor_jwt_signing_keys
  DOR_JWT_ACTIVE_KEY_ID: ${DOR_JWT_ACTIVE_KEY_ID:?DOR_JWT_ACTIVE_KEY_ID must be set}
  DOR_AUTHORITY_SIGNING_KEY_FILE: /run/secrets/dor_authority_signing_key
  DOR_ENCRYPTION_KEY_FILE: /run/secrets/dor_encryption_key
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-runtime-service: &runtime-service
  build:
    context: .
    dockerfile: docker/Dockerfile.runtime
  image: dor-runtime:local
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  migrate:
    <<: *runtime-service
    restart: "no"
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: migrate
      DOR_RUN_MIGRATIONS: "1"
      DOR_BOOTSTRAP_ARTIFACT_BUCKET: "1"
      DOR_BOOTSTRAP_WORKER_IDENTITY: "1"
      DOR_WORKER_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
      DOR_WORKER_SERVICE_ID: ${DOR_WORKER_SERVICE_ID:-factory-worker}
      DOR_WORKER_CREDENTIAL_FILE: /run/secrets/dor_worker_credential
      DOR_WORKER_CAPABILITIES: ${DOR_WORKER_CAPABILITIES:?DOR_WORKER_CAPABILITIES must be set}
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
      - dor_jwt_signing_keys
      - dor_authority_signing_key
      - dor_encryption_key
      - dor_worker_credential
    command: ["/bin/true"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: api
      DOR_API_HOST: 0.0.0.0
      DOR_API_PORT: "8000"
      DOR_ADMIN_USERNAME: ${DOR_ADMIN_USERNAME:-admin}
      DOR_ADMIN_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
      DOR_ADMIN_PASSWORD_FILE: /run/secrets/dor_admin_password
      REDMINE_URL: ${REDMINE_URL:-}
      REDMINE_PROJECT_ID: ${REDMINE_PROJECT_ID:-}
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
      - dor_jwt_signing_keys
      - dor_authority_signing_key
      - dor_encryption_key
      - dor_admin_password
    ports:
      - "${DOR_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    <<: *runtime-service
    command: ["python", "-m", "services.worker_agent"]
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: worker
      DOR_WORKER_CAPABILITIES: ${DOR_WORKER_CAPABILITIES:?DOR_WORKER_CAPABILITIES must be set}
      DOR_WORKER_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
      DOR_WORKER_SERVICE_ID: ${DOR_WORKER_SERVICE_ID:-factory-worker}
      DOR_WORKER_CREDENTIAL_FILE: /run/secrets/dor_worker_credential
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
      - dor_jwt_signing_keys
      - dor_authority_signing_key
      - dor_encryption_key
      - dor_worker_credential
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 8
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      replicas: ${DOR_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  dashboard:
    <<: *runtime-service
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/operator_center.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: dashboard
      HOME: /tmp/dashboard-home
      DOR_API_URL: http://api:8000
      DOR_ADMIN_PASSWORD_FILE: /run/secrets/dor_admin_password
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
      - dor_jwt_signing_keys
      - dor_authority_signing_key
      - dor_encryption_key
      - dor_admin_password
    ports:
      - "${DOR_DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  otel-collector:
    image: otel/opentelemetry-collector:0.132.0
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    healthcheck:
      test: ["CMD", "/otelcol", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

secrets:
  postgres_password:
    file: ${DOR_SECRET_POSTGRES_PASSWORD_FILE:?DOR_SECRET_POSTGRES_PASSWORD_FILE must point to a secret file}
  minio_root_user:
    file: ${DOR_SECRET_MINIO_ROOT_USER_FILE:?DOR_SECRET_MINIO_ROOT_USER_FILE must point to a secret file}
  minio_root_password:
    file: ${DOR_SECRET_MINIO_ROOT_PASSWORD_FILE:?DOR_SECRET_MINIO_ROOT_PASSWORD_FILE must point to a secret file}
  dor_jwt_signing_keys:
    file: ${DOR_SECRET_JWT_SIGNING_KEYS_FILE:?DOR_SECRET_JWT_SIGNING_KEYS_FILE must point to a secret file}
  dor_authority_signing_key:
    file: ${DOR_SECRET_AUTHORITY_SIGNING_KEY_FILE:?DOR_SECRET_AUTHORITY_SIGNING_KEY_FILE must point to a secret file}
  dor_encryption_key:
    file: ${DOR_SECRET_ENCRYPTION_KEY_FILE:?DOR_SECRET_ENCRYPTION_KEY_FILE must point to a secret file}
  dor_admin_password:
    file: ${DOR_SECRET_ADMIN_PASSWORD_FILE:?DOR_SECRET_ADMIN_PASSWORD_FILE must point to a secret file}
  dor_worker_credential:
    file: ${DOR_SECRET_WORKER_CREDENTIAL_FILE:?DOR_SECRET_WORKER_CREDENTIAL_FILE must point to a secret file}

volumes:
  postgres-data:
  object-data:
