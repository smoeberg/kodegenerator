name: dor

x-runtime-environment: &runtime-environment
  DOR_ENV: production
  # Single source of truth: All database URLs built from POSTGRES_* variables
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  DOR_IDENTITY_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  DOR_PIPELINE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  DOR_PIPELINE_STATE_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
  DOR_QUEUE_BACKEND: database
  ARTIFACT_STORE_URL: http://minio:9000
  ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-dor-artifacts}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
  DOR_JWT_SIGNING_KEYS: ${DOR_JWT_SIGNING_KEYS:?DOR_JWT_SIGNING_KEYS must be set}
  DOR_JWT_ACTIVE_KEY_ID: ${DOR_JWT_ACTIVE_KEY_ID:?DOR_JWT_ACTIVE_KEY_ID must be set}
  DOR_AUTHORITY_SIGNING_KEY: ${DOR_AUTHORITY_SIGNING_KEY:?DOR_AUTHORITY_SIGNING_KEY must be set}
  DOR_ENCRYPTION_KEY: ${DOR_ENCRYPTION_KEY:?DOR_ENCRYPTION_KEY must be set}
  DOR_JWT_SECRET_KEY: ${DOR_JWT_SECRET_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-runtime-service: &runtime-service
  build:
    context: .
    dockerfile: docker/Dockerfile.runtime
  image: dor-runtime:local
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: *runtime-environment

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  migrate:
    <<: *runtime-service
    restart: "no"
    environment:
      <<: *runtime-environment
      # PostgreSQL credentials for init_database.py
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      DOR_RUNTIME_ROLE: migrate
      DOR_RUN_MIGRATIONS: "1"
      DOR_BOOTSTRAP_ARTIFACT_BUCKET: "1"
      DOR_BOOTSTRAP_WORKER_IDENTITY: "1"
      DOR_WORKER_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
      DOR_WORKER_SERVICE_ID: ${DOR_WORKER_SERVICE_ID:-factory-worker}
      DOR_WORKER_CREDENTIAL: ${DOR_WORKER_CREDENTIAL:?DOR_WORKER_CREDENTIAL must be set}
      DOR_WORKER_CAPABILITIES: ${DOR_WORKER_CAPABILITIES:?DOR_WORKER_CAPABILITIES must be set}
    command: ["/bin/true"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: api
      DOR_API_HOST: 0.0.0.0
      DOR_API_PORT: "8000"
      DOR_ADMIN_USERNAME: ${DOR_ADMIN_USERNAME:-admin}
      DOR_ADMIN_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
      DOR_ADMIN_PASSWORD: ${DOR_ADMIN_PASSWORD:?DOR_ADMIN_PASSWORD must be set}
    ports:
      - "${DOR_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    <<: *runtime-service
    command: ["python", "-m", "services.worker_agent"]
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: worker
      DOR_WORKER_CAPABILITIES: ${DOR_WORKER_CAPABILITIES:?DOR_WORKER_CAPABILITIES must be set}
      DOR_WORKER_ORGANIZATION_ID: ${DOR_ORGANIZATION_ID:-dor-org}
      DOR_WORKER_SERVICE_ID: ${DOR_WORKER_SERVICE_ID:-factory-worker}
      DOR_WORKER_CREDENTIAL: ${DOR_WORKER_CREDENTIAL:?DOR_WORKER_CREDENTIAL must be set}
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 8
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    deploy:
      replicas: ${DOR_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  dashboard:
    <<: *runtime-service
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      <<: *runtime-environment
      DOR_RUNTIME_ROLE: dashboard
      HOME: /tmp/dashboard-home
      DOR_API_BASE: http://api:8000
      DOR_ADMIN_PASSWORD: ${DOR_ADMIN_PASSWORD:?DOR_ADMIN_PASSWORD must be set}
    ports:
      - "${DOR_DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  otel-collector:
    image: otel/opentelemetry-collector:0.132.0
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    healthcheck:
      test: ["CMD", "/otelcol", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres-data:
  object-data:
