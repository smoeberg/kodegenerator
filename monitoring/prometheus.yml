# monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "dor"
    static_configs:
      - targets: ["host.docker.internal:8000"]  # DOR metrics endpoint
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
